name: Publish to npm

# Push a vX.Y.Z tag at the current main to release. The release job bumps
# package.json to the tag's version with release-it, commits that bump to
# main, and creates the GitHub Release; the publish job then publishes the
# bumped main to npm. Both jobs live in this file because npm trusted
# publishing authorizes the workflow file that starts the run (publish.yml).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to (re)publish, for example v0.11.0."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and create GitHub Release
    if: github.repository == 'darkmatter/effect-sops' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Derive version from tag
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like vX.Y.Z, optionally with a prerelease/build suffix." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure tag was cut from current main
        shell: bash
        run: |
          tag_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          main_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Tag $GITHUB_REF_NAME must point at current main before release-it adds the version bump commit." >&2
            echo "tag=$tag_sha main=$main_sha" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test package
        run: bun run test

      - name: Bump version and create GitHub Release
        run: bun run release -- --ci "${{ steps.release.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish package
    needs: release
    # Runs after a successful release job, or alone for a manual republish.
    if: >-
      always() && github.repository == 'darkmatter/effect-sops' &&
      (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      # main, not the tag: the tag is the commit before release-it's bump.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify release tag matches package version
        id: package
        run: |
          version="${TAG_NAME#v}"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Release tag $TAG_NAME does not match package.json version $package_version."
            exit 1
          fi
          echo "spec=$package_name@$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test package
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test examples
        run: bun run smoke:examples

      - name: Publish
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          # A rerun after a successful publish skips the version already on npm.
          if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published."
          else
            npm publish --provenance
          fi

      - name: Verify npm publication
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          # npm's read path can lag a successful publish by 10+ minutes for
          # new packages and versions; the publish above already succeeded.
          for attempt in $(seq 1 40); do
            if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org; then
              exit 0
            fi
            echo "Not readable yet; retrying in 30s (attempt $attempt/40)"
            sleep 30
          done
          echo "::error::$PACKAGE_SPEC never became readable on the registry"
          exit 1
