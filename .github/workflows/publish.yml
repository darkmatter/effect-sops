name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    if: github.repository == 'darkmatter/effect-sops'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test package
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test examples
        run: bun run smoke:examples

      - name: Read package metadata
        id: package
        run: >-
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "spec=" + pkg.name + "@" + pkg.version + "\n");'

      - name: Check npm publication
        id: npm
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance

      # A freshly published version can take a moment to become readable, so a
      # single `npm view` here fails the job after a successful publish and
      # skips the release below.
      - name: Verify npm publication
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.spec }}
        run: |
          # npm's read path can lag a successful publish by 10+ minutes for
          # new packages and versions; the publish above already succeeded.
          for attempt in $(seq 1 40); do
            if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org; then
              exit 0
            fi
            echo "Not readable yet; retrying in 30s (attempt $attempt/40)"
            sleep 30
          done
          echo "::error::$PACKAGE_SPEC never became readable on the registry"
          exit 1

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
