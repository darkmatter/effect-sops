name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install SOPS v3.13.3
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          release=https://github.com/getsops/sops/releases/download/v3.13.3
          binary=sops-v3.13.3.linux.amd64
          checksums=sops-v3.13.3.checksums.txt
          curl --fail --silent --show-error --location "$release/$binary" --output "$binary"
          curl --fail --silent --show-error --location "$release/$checksums" --output "$checksums"
          awk -v binary="$binary" '$2 == binary' "$checksums" | sha256sum --check --strict
          install -Dm755 "$binary" "$RUNNER_TEMP/sops-bin/sops"
          echo "$RUNNER_TEMP/sops-bin" >> "$GITHUB_PATH"

      - name: Typecheck
        run: bun run check

      - name: Test package
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test examples
        run: bun run smoke:examples
